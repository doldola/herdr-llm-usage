id = "llm-usage"
name = "LLM Usage"
version = "0.10.0"
min_herdr_version = "0.7.5"
description = "LLM accounts, usage and agent activity in one panel: Claude and Codex usage, account switching, auto-switch, tools and skills per pane"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "LLM usage and accounts"
contexts = ["workspace"]
command = ["python3", "llm_usage.py", "open"]

[[actions]]
id = "monitor"
title = "Agent monitor: setup and use of the selected agent"
contexts = ["workspace"]
command = ["python3", "llm_usage.py", "open-monitor"]

[[actions]]
id = "refresh"
title = "Refresh LLM usage in sidebar"
contexts = ["workspace"]
command = ["python3", "llm_usage.py", "sidebar"]

[[actions]]
id = "tick"
title = "Refresh usage and run the auto-switch check"
contexts = ["workspace"]
command = ["python3", "llm_usage.py", "event"]

[[actions]]
id = "codex-restart"
title = "Resume Codex panes on the current login"
contexts = ["workspace"]
command = ["python3", "llm_usage.py", "codex-restart"]

[[startup]]
command = ["python3", "llm_usage.py", "sidebar"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "llm_usage.py", "sidebar"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "llm_usage.py", "event"]

[[panes]]
id = "dashboard"
title = "LLM usage"
placement = "popup"
width = "85%"
height = "85%"
command = ["python3", "llm_usage.py", "dashboard"]

[[panes]]
id = "monitor"
title = "Agents"
placement = "split"
command = ["python3", "llm_usage.py", "monitor"]
