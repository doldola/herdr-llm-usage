id = "llm-usage"
name = "LLM Usage"
version = "0.1.0"
min_herdr_version = "0.7.5"
description = "Show connected LLM accounts and remaining subscription usage (Claude, Codex)"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Show LLM usage"
contexts = ["workspace"]
command = ["python3", "llm_usage.py", "open"]

[[actions]]
id = "refresh"
title = "Refresh LLM usage in sidebar"
contexts = ["workspace"]
command = ["python3", "llm_usage.py", "sidebar"]

[[startup]]
command = ["python3", "llm_usage.py", "sidebar"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "llm_usage.py", "sidebar"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "llm_usage.py", "sidebar"]

[[panes]]
id = "dashboard"
title = "LLM usage"
placement = "popup"
width = 90
height = "70%"
command = ["python3", "llm_usage.py", "dashboard"]
